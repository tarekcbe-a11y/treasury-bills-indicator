
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤشر أذون الخزانة | جروب عملاء البنوك المصرية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-card {
      background-color: #0d0d0d;
      border: 2px solid #d4af37;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px 15px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      text-align: center;
    }

    .main-title {
      color: #d4af37;
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .sub-title {
      color: #ccc;
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    .terms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .term-btn {
      background-color: #141414;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .term-btn.active,
    .term-btn:hover {
      background-color: #d4af37;
      color: #000;
    }

    .section-title {
      background-color: #141414;
      color: #fff;
      text-align: right;
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-right: 4px solid #d4af37;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .table-box {
      border: 1px solid #d4af37;
      border-radius: 12px;
      overflow: auto;
      margin-bottom: 20px;
      background-color: #050505;
      min-height: 150px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.82rem;
    }

    th {
      background-color: #000080;
      color: #fff;
      padding: 10px 4px;
      font-weight: 700;
      white-space: nowrap;
    }

    td {
      padding: 10px 4px;
      color: #fff;
      border-top: 1px solid #222;
      white-space: nowrap;
    }

    td.session-date {
      color: #d4af37;
      font-weight: 800;
    }

    td.yield-val {
      color: #25d366;
      font-weight: 800;
    }

    .ad-space {
      border: 1px dashed #555;
      border-radius: 8px;
      padding: 12px;
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    .footer-brand {
      color: #d4af37;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .developer {
      color: #aaa;
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .loading-message {
      color: #888;
    }

    .error-message {
      color: #ff6b6b;
      padding: 12px 5px;
      font-size: 0.8rem;
      white-space: normal;
    }
  </style>
</head>

<body>
  <div class="app-card">
    <div class="main-title">مؤشر أذون الخزانة</div>
    <div class="sub-title">
      نتائج عطاءات أذون الخزانة الرسمية (أحدث 52 أسبوعاً)
    </div>

    <!-- أزرار اختيار الأجل الستة -->
    <div class="terms-grid">
      <button class="term-btn" onclick="selectTerm('91', this)">91 يوم</button>
      <button class="term-btn active" id="btn-182" onclick="selectTerm('182', this)">182 يوم</button>
      <button class="term-btn" onclick="selectTerm('273', this)">273 يوم</button>
      <button class="term-btn" onclick="selectTerm('364', this)">364 يوم</button>
      <button class="term-btn" onclick="selectTerm('357', this)">357 يوم</button>
      <button class="term-btn" onclick="selectTerm('other', this)">مدد أخرى</button>
    </div>

    <div class="section-title" id="section-header">
      سجل نتائج أجل 182 يوم
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>تاريخ الجلسة</th>
            <th>تاريخ الإصدار</th>
            <th>تاريخ الاستحقاق</th>
            <th>متوسط العائد %</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="4" class="loading-message">جاري جلب البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ad-space">
      مساحة إعلان (Google AdMob 320x50)
    </div>

    <div class="footer-brand">
      🛡️ جروب عملاء البنوك المصرية
    </div>
    <div class="developer">Developed by Tarek Metwally</div>
  </div>

  <script>
    /*
      رابط النشر الجديد الذي أرسله الأستاذ طارق.
      نطلب البيانات بصيغة CSV من الورقة الأولى gid=0.
    */
    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQp4jGbTtNydAA3tCX7s3W_xhVPnMCkgiR-xpCvCFoNbhcta59z3sWQPwcCaPoO3FTEEEazLDaeoOjZ/pub?gid=0&single=true&output=csv";

    let allData = [];
    let currentTerm = "182";

    async function fetchData() {
      const tbody = document.getElementById("table-body");

      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="loading-message">جاري جلب البيانات...</td>
        </tr>
      `;

      try {
        const response = await fetch(csvUrl, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const csvText = await response.text();

        // التأكد من أن الاستجابة بيانات وليست صفحة HTML
        if (
          csvText.trim().startsWith("<") ||
          csvText.trim().startsWith("<!DOCTYPE")
        ) {
          throw new Error("استجابة Google ليست CSV");
        }

        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          allData = [];
          renderTable();
          return;
        }

        /*
          ترتيب أعمدة الجدول:
          A: الطابع الزمني
          B: الأجل
          C: تاريخ الجلسة
          D: تاريخ الإصدار
          E: تاريخ الاستحقاق
          F: متوسط العائد
        */
        allData = rows.slice(1)
          .filter(row => row.length >= 6)
          .map(row => {
            const rawTerm = String(row[1] || "").trim();

            return {
              rawTerm: rawTerm,
              term: normalizeTerm(rawTerm),
              session: String(row[2] || "").trim(),
              issue: String(row[3] || "").trim(),
              maturity: String(row[4] || "").trim(),
              yield: String(row[5] || "").trim()
            };
          })
          .filter(row => row.term && row.yield);

        renderTable();

      } catch (error) {
        console.error("خطأ في تحميل Google Sheets:", error);

        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="error-message">
              تعذر تحميل البيانات. تأكد من نشر الجدول بصيغة CSV
              وإتاحته للعرض العام.
            </td>
          </tr>
        `;
      }
    }

    // استخراج رقم الأجل حتى لو كان مكتوباً معه كلمة يوم
    function normalizeTerm(value) {
      const text = String(value || "").trim();
      const match = text.match(/\d+/);
      return match ? match[0] : text;
    }

    // محلل CSV يدعم الفواصل داخل النصوص وعلامات الاقتباس
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
          if (quoted && text[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (char === "," && !quoted) {
          row.push(value.trim());
          value = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !quoted
        ) {
          if (char === "\r" && text[i + 1] === "\n") {
            i++;
          }

          row.push(value.trim());

          if (row.some(cell => cell !== "")) {
            rows.push(row);
          }

          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      if (value !== "" || row.length > 0) {
        row.push(value.trim());
        rows.push(row);
      }

      return rows;
    }

    function selectTerm(term, button) {
      currentTerm = term;

      document.querySelectorAll(".term-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      if (button) {
        button.classList.add("active");
      }

      const titles = {
        "91": "سجل نتائج أجل 91 يوم",
        "182": "سجل نتائج أجل 182 يوم",
        "273": "سجل نتائج أجل 273 يوم",
        "364": "سجل نتائج أجل 364 يوم",
        "357": "سجل نتائج أجل 357 يوم",
        "other": "سجل نتائج المدد الأخرى"
      };

      document.getElementById("section-header").innerText =
        titles[term] || `سجل نتائج أجل ${term} يوم`;

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("table-body");

      const filtered = allData.filter(row => {
        if (currentTerm === "other") {
          return !["91", "182", "273", "364", "357"].includes(row.term);
        }

        return row.term === currentTerm;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="loading-message">
              لا توجد نتائج مسجلة لهذا الأجل حتى الآن
            </td>
          </tr>
        `;
        return;
      }

      // الأحدث أولاً: الصف الأخير في الجدول يظهر في البداية
      tbody.innerHTML = filtered.slice().reverse().map(row => {
        let yieldValue = escapeHTML(row.yield);

        if (yieldValue && !yieldValue.includes("%")) {
          yieldValue += "%";
        }

        return `
          <tr>
            <td class="session-date">${escapeHTML(row.session)}</td>
            <td>${escapeHTML(row.issue)}</td>
            <td>${escapeHTML(row.maturity)}</td>
            <td class="yield-val">${yieldValue}</td>
          </tr>
        `;
      }).join("");
    }

    // حماية عرض النصوص القادمة من الجدول
    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // تشغيل تحميل البيانات عند فتح الموقع
    fetchData();
  </script>
</body>
</html>

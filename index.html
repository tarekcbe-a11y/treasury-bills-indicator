<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مؤشر أذون الخزانة المصرية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* حاوية محكومة بدون أي ارتفاعات زائدة أو فراغات ميتة */
        .app-frame {
            width: 100%;
            max-width: 420px;
            height: auto;
            background-color: #121212;
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }

        .header-title {
            text-align: center;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .sub-header {
            text-align: center;
            color: #cccccc;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .tabs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            background: #1e1e1e;
            border: 1px solid #d4af37;
            color: #ffd700;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #d4af37;
            color: #000000;
        }

        .current-page-badge {
            background: #1a1a1a;
            border-right: 4px solid #d4af37;
            padding: 6px 10px;
            font-size: 12px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* ضبط الارتفاع ليعرض 3 إلى 4 سطور فقط ثم السكرول */
        .table-container {
            width: 100%;
            height: 160px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #d4af37;
            background-color: #181818;
            margin-bottom: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            position: sticky;
            top: 0;
            background-color: #000080;
            color: #ffffff;
            padding: 8px 4px;
            font-size: 11px;
            border-bottom: 1px solid #d4af37;
            z-index: 2;
        }

        td {
            padding: 8px 4px;
            border-bottom: 1px solid #282828;
            color: #ffffff;
            font-size: 11px;
        }

        .yield-badge {
            color: #4caf50;
            font-weight: bold;
        }

        .no-data {
            color: #aaaaaa;
            padding: 30px 10px;
            font-size: 12px;
        }

        .admob-container {
            width: 100%;
            height: 50px;
            background-color: #1c1c1c;
            border: 1px dashed #d4af37;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888888;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .footer-branding {
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .footer-group-name {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .footer-developer {
            color: #d4af37;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="app-frame">
    <div class="header-title">مؤشر أذون الخزانة</div>
    <div class="sub-header">نتائج عطاءات أذون الخزانة الرسمية (أحدث 52 أسبوعاً)</div>

    <div class="tabs-grid">
        <button class="tab-btn active" onclick="switchTab('91', this)">91 يوم</button>
        <button class="tab-btn" onclick="switchTab('182', this)">182 يوم</button>
        <button class="tab-btn" onclick="switchTab('273', this)">273 يوم</button>
        <button class="tab-btn" onclick="switchTab('364', this)">364 يوم</button>
        <button class="tab-btn" onclick="switchTab('357', this)">357 يوم</button>
        <button class="tab-btn" onclick="switchTab('other', this)">مدد أخرى</button>
    </div>

    <div class="current-page-badge" id="pageTitle">سجل نتائج أجل 91 يوم</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>تاريخ الجلسة</th>
                    <th>تاريخ الإصدار</th>
                    <th>تاريخ الاستحقاق</th>
                    <th>متوسط العائد %</th>
                </tr>
            </thead>
            <tbody id="tableData">
                <tr>
                    <td colspan="4" class="no-data">لا توجد بيانات مسجلة حالياً لهذا الأجل</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="admob-container">
        <span>مساحة إعلان Google AdMob (320x50)</span>
    </div>

    <div class="footer-branding">
        <div class="footer-group-name">
            🛡️ جروب عملاء البنوك المصرية
        </div>
        <div class="footer-developer">
            Developed by Tarek Metwally
        </div>
    </div>
</div>

<script>
    const MAX_ROWS = 52;
    let mockData = { '91': [], '182': [], '273': [], '364': [], '357': [], 'other': [] };
    let currentKey = '91';

    async function loadExternalData() {
        try {
            const response = await fetch('./data.json?cache=' + Date.now());
            if (response.ok) {
                mockData = await response.json();
            }
        } catch (e) {}
        loadData(currentKey);
    }

    function loadData(key) {
        currentKey = key;
        const tbody = document.getElementById('tableData');
        tbody.innerHTML = '';

        const titleMap = {
            '91': 'سجل نتائج أجل 91 يوم',
            '182': 'سجل نتائج أجل 182 يوم',
            '273': 'سجل نتائج أجل 273 يوم',
            '364': 'سجل نتائج أجل 364 يوم',
            '357': 'سجل نتائج أجل 357 يوم',
            'other': 'سجل نتائج مدد أخرى'
        };

        document.getElementById('pageTitle').innerText = titleMap[key] || '';
        let list = mockData[key] || [];

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">لا توجد بيانات مسجلة حالياً لهذا الأجل</td></tr>`;
            return;
        }

        list.slice(0, MAX_ROWS).forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td style="color: #ffd700; font-weight: bold;">${row.session}</td>
                    <td>${row.issue}</td>
                    <td>${row.maturity}</td>
                    <td class="yield-badge">${row.yield}</td>
                </tr>
            `;
        });
    }

    function switchTab(key, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadData(key);
    }

    loadExternalData();
</script>

</body>
</html>

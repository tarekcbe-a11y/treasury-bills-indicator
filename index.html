<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            touch-action: none;
        }

        .app-frame {
            width: 100%;
            max-width: 380px;
            height: 560px;
            background-color: #121212;
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 12px 10px 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            touch-action: auto;
        }

        .header-title {
            text-align: center;
            color: #ffd700;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .sub-header {
            text-align: center;
            color: #cccccc;
            font-size: 10.5px;
            margin-bottom: 8px;
        }

        .tabs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

            color: #ffd700;
            padding: 5px 2px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

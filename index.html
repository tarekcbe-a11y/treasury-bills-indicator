<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤشر أذون الخزانة | جروب عملاء البنوك المصرية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-card {
      background-color: #0d0d0d;
      border: 2px solid #d4af37;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px 15px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      text-align: center;
    }

    .main-title {
      color: #d4af37;
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .sub-title {
      color: #ccc;
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    .terms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .term-btn {
      background-color: #141414;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .term-btn.active, .term-btn:hover {
      background-color: #d4af37;
      color: #000;
    }

    .section-title {
      background-color: #141414;
      color: #fff;
      text-align: right;
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-right: 4px solid #d4af37;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .table-box {
      border: 1px solid #d4af37;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background-color: #050505;
      min-height: 150px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.82rem;
    }

    th {
      background-color: #000080;
      color: #fff;
      padding: 10px 4px;
      font-weight: 700;
    }

    td {
      padding: 10px 4px;
      color: #fff;
      border-top: 1px solid #222;
    }

    td.session-date {
      color: #d4af37;
      font-weight: 800;
    }

    td.yield-val {
      color: #25d366;
      font-weight: 800;
    }

    .ad-space {
      border: 1px dashed #555;
      border-radius: 8px;
      padding: 12px;
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    .footer-brand {
      color: #d4af37;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .developer {
      color: #aaa;
      font-size: 0.75rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="main-title">مؤشر أذون الخزانة</div>
    <div class="sub-title">نتائج عطاءات أذون الخزانة الرسمية (أحدث 52 أسبوعاً)</div>

    <!-- أزرار اختيار الأجل -->
    <div class="terms-grid">
      <button class="term-btn" onclick="selectTerm('91', event)">91 يوم</button>
      <button class="term-btn active" id="btn-182" onclick="selectTerm('182', event)">182 يوم</button>
      <button class="term-btn" onclick="selectTerm('273', event)">273 يوم</button>
      <button class="term-btn" onclick="selectTerm('364', event)">364 يوم</button>
      <button class="term-btn" onclick="selectTerm('357', event)">357 يوم</button>
      <button class="term-btn" onclick="selectTerm('other', event)">مدد أخرى</button>
    </div>

    <!-- عنوان الأجل المحدد -->
    <div class="section-title" id="section-header">سجل نتائج أجل 182 يوم</div>

    <!-- جدول البيانات -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>تاريخ الجلسة</th>
            <th>تاريخ الإصدار</th>
            <th>تاريخ الاستحقاق</th>
            <th>متوسط العائد %</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="4" style="color: #888;">جاري جلب البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- مساحة الإعلان -->
    <div class="ad-space">
      مساحة إعلان (Google AdMob 320x50)
    </div>

    <!-- اسم الجروب وحقوق التطوير -->
    <div class="footer-brand">
      🛡️ جروب عملاء البنوك المصرية
    </div>
    <div class="developer">Developed by Tarek Metwally</div>
  </div>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRC_O4MdWlDeEK1UKaq1-ym4anzduuXyDEVfjvmFKnzPU-jsluc1DSr1HZjMxwl-yzVeytBMXDWH3/pub?gid=0&single=true&output=csv";
    
    let allData = [];
    let currentTerm = '182';

    function fetchData() {
      fetch(csvUrl)
        .then(res => res.text())
        .then(csvText => {
          allData = parseCSV(csvText);
          renderTable();
        })
        .catch(err => {
          document.getElementById('table-body').innerHTML = '<tr><td colspan="4" style="color:red;">خطأ في الاتصال بالبيانات</td></tr>';
        });
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const val = lines[i].split(/,(?=(?:(?:[^\"]*\"){2})*[^\"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
        
        if (val.length >= 5) {
          rows.push({
            term: val[1] || '',
            session: val[2] || '',
            issue: val[3] || '',
            maturity: val[4] || '',
            yield: val[5] || ''
          });
        }
      }
      return rows;
    }

    function selectTerm(term, evt) {
      currentTerm = term;
      
      document.querySelectorAll('.term-btn').forEach(btn => btn.classList.remove('active'));
      if(evt && evt.target) {
        evt.target.classList.add('active');
      }

      const titles = {
        '91': 'سجل نتائج أجل 91 يوم',
        '182': 'سجل نتائج أجل 182 يوم',
        '273': 'سجل نتائج أجل 273 يوم',
        '364': 'سجل نتائج أجل 364 يوم',
        '357': 'سجل نتائج أجل 357 يوم',
        'other': 'سجل نتائج المدد الأخرى'
      };
      document.getElementById('section-header').innerText = titles[term] || `سجل نتائج أجل ${term} يوم`;

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      
      // عرض كافة البيانات المتاحة مباشرة بدون شروط معقدة للتأكد من ظهورها في الجدول
      let filtered = allData;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: #888;">لا توجد نتائج مسجلة حتى الآن</td></tr>';
        return;
      }

      let html = '';
      filtered.reverse().forEach(row => {
        let yieldStr = row.yield;
        if (yieldStr && !yieldStr.includes('%')) yieldStr += '%';

        html += `
          <tr>
            <td class="session-date">${row.session || ''}</td>
            <td>${row.issue || ''}</td>
            <td>${row.maturity || ''}</td>
            <td class="yield-val">${yieldStr || ''}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    fetchData();
  </script>
</body>
</html>
